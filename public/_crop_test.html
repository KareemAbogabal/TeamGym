<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InBody crop OCR test</title>
<style>
  body { font-family: monospace; margin: 8px; background:#111; color:#eee; }
  pre { white-space: pre-wrap; font-size: 11px; max-height: 95vh; overflow: auto; border: 1px solid #444; padding: 8px; }
  .img-up { display: none; }
</style>
</head>
<body>
  <pre id="out">waiting...</pre>
  <input type="file" class="inbodyUpload" id="body">
  <button type="button" class="show-img-inBody">show</button>
  <button type="button" class="remove-img-inBody">x</button>
  <span id="status"></span>
  <div class="img-up"><div class="content"><div class="img"></div></div></div>

  <script src="js/Website/Dashboard/pages/Inbody-coordinates.js?v=croptest"></script>
  <script>
    const out = document.getElementById("out");
    const log = (msg) => { out.textContent += msg + "\n"; };

    async function ocrCrop(canvas, x, y, w, h, label) {
      const crop = cropCanvas(canvas, x, y, w, h);
      const results = [];
      for (const [psm, pg] of [["7","7"],["6","6"],["11","11"],["13","13"]]) {
        for (const [sl, mult] of [["1x",1],["2x",2],["3x",3]]) {
          const cv = mult === 1 ? crop : scaleCanvasTo(crop, mult);
          const config = {
            logger: () => {},
            tessedit_char_whitelist: "0123456789.,%kg",
            tessedit_pageseg_mode: psm,
          };
          try {
            const res = await Tesseract.recognize(cv, "eng", config);
            const text = (res.data.text || "").replace(/[\r\n]/g, " | ").trim();
            const conf = Number(res.data.confidence || 0);
            results.push(`${psm}/${sl}: conf=${conf.toFixed(0)} txt="${text}"`);
          } catch (e) {
            results.push(`${psm}/${sl}: ERR ${e.message}`);
          }
        }
      }
      log(`=== ${label} (${x},${y} ${w}x${h}) raw ===`);
      results.forEach((r) => log("  " + r));
    }

    async function run() {
      try {
        const r = await fetch("images/IMG20250908193729.jpg");
        if (!r.ok) throw new Error("fetch -> " + r.status);
        const blob = await r.blob();
        const file = new File([blob], "IMG20250908193729.jpg", { type: "image/jpeg" });
        log("preprocessing...");
        const c = await preprocessToCanvas(file, 3, true);
        window.__lastRawCanvas = c.rawCanvas;
        window.__lastThreshCanvas = c.threshCanvas;
        const raw = c.rawCanvas;
        const th = c.threshCanvas;
        log(`canvas ${raw.width}x${raw.height}`);

        await ocrCrop(raw, 3150, 4680, 900, 300, "SMM raw");
        await ocrCrop(th, 3150, 4680, 900, 300, "SMM thresh");
        await ocrCrop(raw, 3150, 6330, 900, 300, "BMI raw");
        await ocrCrop(th, 3150, 6330, 900, 300, "BMI thresh");
        await ocrCrop(raw, 3150, 6690, 900, 300, "PBF raw");
        await ocrCrop(th, 3150, 6690, 900, 300, "PBF thresh");

        await ocrCrop(raw, 440, 7810, 900, 220, "LARM raw");
        await ocrCrop(raw, 2110, 7820, 520, 200, "RARM raw");
        await ocrCrop(raw, 420, 9150, 900, 260, "LLEG raw");
        await ocrCrop(raw, 1910, 9170, 700, 240, "RLEG raw");
        window.__harnessDone = true;
      } catch (e) {
        log("ERROR " + e.message);
        window.__harnessDone = true;
      }
    }

    const loadTesseract = () => new Promise((resolve, reject) => {
      if (typeof Tesseract !== "undefined") return resolve();
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("failed to load tesseract.js"));
      document.head.appendChild(s);
    });

    // hook removed — run() calls preprocessToCanvas directly
    loadTesseract().then(run).catch((e) => log("ERROR: " + e.message));
  </script>
</body>
</html>
